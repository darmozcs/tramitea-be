name: tramitea-be

# Publicada por Traefik en https://<APP_DOMAIN>/tramitea-api (el context path
# de Spring, así que no hace falta stripprefix). El front también la sigue
# consumiendo por la red interna como http://tramitea-be:8080/tramitea-api.
# Mismo dominio que el front (/tramitea): el navegador la llama same-origin,
# sin CORS.
services:
  tramitea-be:
    image: ${APP_IMAGE:-ghcr.io/darmozcs/tramitea-be:latest}
    container_name: tramitea-be
    restart: unless-stopped
    env_file: .env
    mem_limit: 768m
    volumes:
      # Llave pública de darmoz-auth (solo se usa con AUTH_MODE=darmoz). No es
      # secreta; se monta de la carpeta de darmoz-auth para no duplicarla.
      - ../darmoz-auth/keys/public_key.pem:/app/keys/darmoz_public_key.pem:ro
    networks: [proxy, data]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # Más larga que la regla del front (/tramitea), así que tiene prioridad.
      - "traefik.http.routers.tramitea-be.rule=Host(`${APP_DOMAIN:-darmozsc.duckdns.org}`) && PathPrefix(`/tramitea-api`)"
      - "traefik.http.routers.tramitea-be.entrypoints=websecure"
      - "traefik.http.routers.tramitea-be.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tramitea-be.middlewares=secure-headers@file,tramitea-be-ratelimit"
      # API pública: limita a 20 req/s por IP (ráfagas de 50).
      - "traefik.http.middlewares.tramitea-be-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.tramitea-be-ratelimit.ratelimit.burst=50"
      - "traefik.http.services.tramitea-be.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true
  data:
    external: true
