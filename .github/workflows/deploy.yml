name: Deploy tramitea-be

on:
  push: { branches: [main] }
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/tramitea-be

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: ./mvnw -B test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted   # runner de darmozcs/tramitea-be
    steps:
      - run: |
          cd /opt/infra/services/tramitea-be
          docker compose pull
          docker compose up -d
          docker image prune -f
